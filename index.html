            padding: 100px;
            color: white;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 50px;
            border-radius: 15px;
            width: 600px;
            margin: auto;

        }

        h1 {
            font-size: 40px;
        }

        p {
            font-size: 18px;
            margin-top: 20px;
        }

        a {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 25px;
            background: white;
            color: #764ba2;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            transition: 0.3s;
        }

        a:hover {
            background: #f0f0f0;
        }
    </style>
</head>

<div class="container">
    <h1>Product Analytics Dashboard</h1>
